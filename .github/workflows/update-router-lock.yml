name: Update router lockfile

on:
  push:
    branches:
      - security-hardening-suite

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: security-hardening-suite

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate secure router lockfile
        run: npm install --package-lock-only --ignore-scripts react-router-dom@^7.18.3

      - name: Verify production dependency audit
        run: npm audit --omit=dev

      - name: Commit lockfile update when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "Update React Router security release"
          git push origin HEAD:security-hardening-suite
