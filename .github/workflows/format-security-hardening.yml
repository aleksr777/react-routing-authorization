name: Format security hardening branch

on:
  push:
    branches:
      - security-hardening-suite

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: security-hardening-suite

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npm run prettier:fix

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git commit -m "Format frontend security hardening changes"
          git push origin HEAD:security-hardening-suite
