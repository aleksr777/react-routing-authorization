name: Remediate development dependencies

on:
  push:
    branches:
      - security-hardening-suite

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: security-hardening-suite
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply compatible audit fixes
        run: npm audit fix
      - name: Verify complete dependency audit
        run: npm audit
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run prettier
      - name: Regression tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit dependency remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency files changed."
            exit 0
          fi
          git commit -m "Update vulnerable development dependencies"
          git push origin HEAD:security-hardening-suite
