name: Temporary dependency cleanup

on:
  push:
    branches:
      - cleanup-unused-code

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CI: true
      VITE_API_URL: https://api.example.invalid/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: cleanup-unused-code

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Remove unused dependencies
        run: npm uninstall ramda @types/ramda --package-lock-only

      - name: Install cleaned dependency graph
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run prettier

      - name: Regression tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit lockfile cleanup
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Remove unused frontend dependencies"
          git push origin HEAD:cleanup-unused-code
